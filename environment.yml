name: logibridge

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.2.2
      - scikit-learn==1.5.0
      - matplotlib==3.8.4

      - jupyter==1.1.1

      # Experiment tracking & dependencies
      - mlflow==3.1.0
      - protobuf>=3.20.3,<4.21.0
      - packaging<26

      # Deep learning (Legacy Keras stack for TFMOT compatibility)
      - tensorflow==2.16.2
      - tf_keras==2.16.0
      - tensorflow-model-optimization==0.8.0

      # API serving
      - fastapi==0.111.0
      - uvicorn[standard]==0.30.1

      # MQTT
      - paho-mqtt==2.1.0

      # Utilities
      - psutil==5.9.8
      - joblib==1.4.2

      # Configuration
      - pydantic==2.7.4
      - pydantic-settings==2.3.0
      - python-dotenv==1.0.1
      - PyYAML==6.0.1

      # Testing / linting
      - pytest==8.2.2
      - ruff==0.4.8