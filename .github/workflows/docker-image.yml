name: Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build LogiBridge Edge Inference Image
      run: |
        docker build . \
          --file Dockerfile \
          --tag logibridge-inference:v1.0 \
          --tag logibridge-inference:latest

    - name: Run Smoke Test on Container
      run: |
        docker run --rm logibridge-inference:v1.0 python -c "import tflite_runtime; print('TFLite Runtime loaded successfully!')"