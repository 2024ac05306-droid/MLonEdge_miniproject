---
- name: LogiBridge Edge Model & Container Deployment Playbook
  hosts: localhost
  connection: local
  vars:
    target_dir: "/opt/logibridge"
    local_model: "./models/model_ptq.tflite"
    local_stats: "./data/training_stats.npy"
    local_ref_dist: "./monitoring/reference_dist.json"
    container_name: "logibridge_inference_service"
    image_name: "logibridge-inference:v1.0"
    mqtt_broker_ip: "127.0.0.1"

  tasks:
    # Task 1: Create /opt/logibridge directory if not present
    - name: 1. Create target directory on edge node
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: directory
        mode: '0755'

    # Task 2: Copy TFLite model file
    - name: 2. Copy TFLite model file
      ansible.builtin.copy:
        src: "{{ local_model }}"
        dest: "{{ target_dir }}/model_ptq.tflite"
        mode: '0644'

    # Task 3: Copy training statistics file (Task C2 Requirement)
    - name: 3. Copy training statistics file
      ansible.builtin.copy:
        src: "{{ local_stats }}"
        dest: "{{ target_dir }}/training_stats.npy"
        mode: '0644'

    # Task 4: Copy updated reference_dist.json
    - name: 4. Copy reference distribution file
      ansible.builtin.copy:
        src: "{{ local_ref_dist }}"
        dest: "{{ target_dir }}/reference_dist.json"
        mode: '0644'

    # Task 5: Stop existing inference container if running
    - name: 5. Stop existing inference container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    # Task 6: Pull updated container image from local Docker registry
    - name: 6. Pull latest container image
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: local

    # Task 7: Start inference container with environment variables and correct volume mounts
    - name: 7. Start inference container with environment variables
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        network_mode: host
        env:
          MODEL_PATH: "/opt/logibridge/model_ptq.tflite"
          MQTT_BROKER: "{{ mqtt_broker_ip }}"
          MQTT_PORT: "1883"
        volumes:
          - "{{ target_dir }}:/opt/logibridge"

    # Task 8: Wait 15 seconds and verify container health
    - name: 8. Wait and verify container health
      ansible.builtin.wait_for:
        timeout: 15
      delegate_to: localhost