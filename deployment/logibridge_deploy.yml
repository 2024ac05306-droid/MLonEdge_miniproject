---
- name: LogiBridge Edge Model & Container Deployment Playbook
  hosts: localhost
  connection: local
  vars:
    target_dir: "/opt/logibridge"
    local_model: "{{ playbook_dir }}/../models/model_ptq.tflite"
    local_ref_dist: "{{ playbook_dir }}/../monitoring/reference_dist.json"
    container_name: "logibridge_inference_service"
    image_name: "logibridge-inference:v1.0"
    mqtt_broker_ip: "127.0.0.1"

  tasks:
    # ── Task 1 ──────────────────────────────────────────────
    - name: 1. Create /opt/logibridge directory if not present
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: directory
        mode: '0755'

    # ── Task 2 ──────────────────────────────────────────────
    - name: 2. Copy new model file to /opt/logibridge/model.tflite
      ansible.builtin.copy:
        src: "{{ local_model }}"
        dest: "{{ target_dir }}/model_ptq.tflite"
        mode: '0644'
      register: model_copy

    # ── Task 3 ──────────────────────────────────────────────
    - name: 3. Copy updated reference_dist.json
      ansible.builtin.copy:
        src: "{{ local_ref_dist }}"
        dest: "{{ target_dir }}/reference_dist.json"
        mode: '0644'
      register: ref_copy

    # ── Task 4 ──────────────────────────────────────────────
    # FIX: gated on whether the model or reference file actually changed.
    # An unmodified redeploy should not touch a healthy running container.
    - name: 4. Stop the running inference container if running
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      when: model_copy.changed or ref_copy.changed
      ignore_errors: true

    # ── Task 5 ──────────────────────────────────────────────
    - name: 5. Pull updated container image from local Docker registry
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: local

    # ── Task 6 ──────────────────────────────────────────────
    # Always ensure the container is running — docker_container's own
    # native idempotency means this reports changed=false if the
    # container already matches this exact desired config.
    - name: 6. Start inference container with environment variables
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        network_mode: host
        env:
          MODEL_PATH: "/opt/logibridge/model_ptq.tflite"
          MQTT_BROKER: "{{ mqtt_broker_ip }}"
          MQTT_PORT: "1883"
        volumes:
          - "{{ target_dir }}:/opt/logibridge"

    # ── Task 7 ──────────────────────────────────────────────

      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: health_check
      until: health_check.container.State.Running
      retries: 3
      delay: 5
      changed_when: false
      failed_when: not health_check.container.State.Running
