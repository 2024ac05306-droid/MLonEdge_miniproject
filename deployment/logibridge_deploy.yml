---
- name: LogiBridge Edge Model & Container Deployment Playbook
  hosts: localhost
  connection: local
  vars:
    target_dir: "/opt/logibridge"
    local_model: "./models/model_ptq.tflite"
    local_ref_dist: "./outputs/reference_dist.json"
    container_name: "logibridge_inference_service"
    image_name: "logibridge-inference:v1.0"
    mqtt_broker_ip: "127.0.0.1"

  tasks:
    # Task 1: Create /opt/logibridge directory if not present
    - name: 1. Create target directory on edge node
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: directory
        mode: '0755'

    # Task 2: Copy new model file to /opt/logibridge/model.tflite
    - name: 2. Copy TFLite model file
      ansible.builtin.copy:
        src: "{{ local_model }}"
        dest: "{{ target_dir }}/model.tflite"
        mode: '0644'

    # Task 3: Copy updated reference_dist.json
    - name: 3. Copy reference distribution file
      ansible.builtin.copy:
        src: "{{ local_ref_dist }}"
        dest: "{{ target_dir }}/reference_dist.json"
        mode: '0644'

    # Task 4: Stop the running inference container if running
    - name: 4. Stop existing inference container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    # Task 5: Pull updated container image from local Docker registry
    - name: 5. Pull latest container image
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: local

    # Task 6: Start inference container with environment variables
    - name: 6. Start inference container with environment variables
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        network_mode: host
        env:
          MODEL_PATH: "{{ target_dir }}/model.tflite"
          MQTT_BROKER: "{{ mqtt_broker_ip }}"
          MQTT_PORT: "1883"
        volumes:
          - "{{ target_dir }}:/app/config"

    # Task 7: Wait 15 seconds and verify container is running
    - name: 7. Wait and verify container health
      ansible.builtin.wait_for:
        timeout: 15
      delegate_to: localhost